# Local Postgres for development. Run: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricehawk
      POSTGRES_PASSWORD: pricehawk
      POSTGRES_DB: pricehawk
    ports:
      - "5432:5432"
    volumes:
      - pricehawk-pgdata:/var/lib/postgresql/data

volumes:
  pricehawk-pgdata:
